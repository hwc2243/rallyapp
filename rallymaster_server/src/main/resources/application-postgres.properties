# Activate this profile where PostgreSQL is available:
# SPRING_PROFILES_ACTIVE=postgres
spring.datasource.url=${RALLYMASTER_DATABASE_URL:jdbc:postgresql://localhost:5432/rallymaster}
spring.datasource.username=${RALLYMASTER_DATABASE_USERNAME:rallymaster}
spring.datasource.password=${RALLYMASTER_DATABASE_PASSWORD:rallymaster}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
