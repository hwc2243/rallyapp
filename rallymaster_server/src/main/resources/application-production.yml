server:
  port: 8082
  # Respect the original HTTPS host and scheme when deployed behind a proxy.
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rallymaster
    username: rallymaster
    password: w31c0m3
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://login.connors.ddns.net/realms/rallymaster}
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: rallymaster-web
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:https://login.connors.ddns.net/realms/rallymaster}
