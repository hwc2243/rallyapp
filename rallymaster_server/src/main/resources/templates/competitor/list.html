<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Competitors · RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/rallymaster-theme.css}" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <div th:replace="~{fragments/layout :: navbar}"></div>
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <a class="small text-decoration-none" th:href="@{/rally/{rallyId}/routes/{routeId}(rallyId=${rally.id},routeId=${route.id})}"><i class="bi bi-arrow-left"></i> Route items</a>
        <h1 class="h2 mb-1 mt-2">Competitors</h1>
        <p class="text-body-secondary mb-0"><span th:text="${rally.name}">Rally</span> · <span th:text="${route.name}">Route</span></p>
      </div>
    </div>
    <section class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
      <thead><tr><th>Car</th><th>Driver</th><th>Navigator</th><th class="text-end">Actions</th></tr></thead>
      <tbody>
        <tr th:each="competitor : ${competitors}">
          <td class="fw-semibold" th:text="${competitor.carNumber}">1</td>
          <td th:text="${competitor.driverFirstName + ' ' + competitor.driverLastName}">Driver</td>
          <td th:text="${competitor.navigatorFirstName + ' ' + competitor.navigatorLastName}">Navigator</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/rally/{rallyId}/routes/{routeId}/competitors/{entryId}/edit(rallyId=${rally.id},routeId=${route.id},entryId=${competitor.entryId})}"><i class="bi bi-pencil"></i><span class="visually-hidden">Edit competitor</span></a>
            <a class="btn btn-sm btn-outline-secondary" th:if="${telemetryEntryIds.contains(competitor.entryId)}" th:href="@{/rally/{rallyId}/routes/{routeId}/competitors/{entryId}/telemetry(rallyId=${rally.id},routeId=${route.id},entryId=${competitor.entryId})}"><i class="bi bi-map"></i><span class="visually-hidden">View telemetry</span></a>
            <form class="d-inline" method="post" th:action="@{/rally/{rallyId}/routes/{routeId}/competitors/{entryId}/delete(rallyId=${rally.id},routeId=${route.id},entryId=${competitor.entryId})}" onsubmit="return confirm('Delete this competitor registration? This cannot be undone.');">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i><span class="visually-hidden">Delete competitor</span></button>
            </form>
          </td>
        </tr>
        <tr th:if="${competitors.isEmpty()}"><td colspan="4" class="text-center text-body-secondary py-5">No competitors have registered for this route.</td></tr>
      </tbody>
    </table></div></section>
  </main>
</body>
</html>
