<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Competitor · RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/rallymaster-theme.css}" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <div th:replace="~{fragments/layout :: navbar}"></div>
  <main class="container py-4"><div class="row justify-content-center"><div class="col-lg-7">
    <a class="small text-decoration-none" th:href="@{/rally/{rallyId}/routes/{routeId}/competitors(rallyId=${rally.id},routeId=${route.id})}">← Competitors</a>
    <h1 class="h2 mt-2 mb-1">Edit competitor</h1>
    <p class="text-body-secondary mb-4"><span th:text="${rally.name}">Rally</span> · <span th:text="${route.name}">Route</span></p>
    <form class="card border-0 shadow-sm" method="post" th:object="${competitor}" th:action="@{/rally/{rallyId}/routes/{routeId}/competitors/{entryId}(rallyId=${rally.id},routeId=${route.id},entryId=${entryId})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="card-body p-4">
        <div class="mb-3"><label class="form-label" for="carNumber">Car number</label><input class="form-control" id="carNumber" min="1" required th:field="*{carNumber}" type="number"><div class="invalid-feedback d-block" th:errors="*{carNumber}"></div></div>
        <h2 class="h5 mt-4">Driver</h2>
        <div class="row g-3"><div class="col-md-6"><label class="form-label" for="driverFirstName">First name</label><input class="form-control" id="driverFirstName" required th:field="*{driverFirstName}" type="text"><div class="invalid-feedback d-block" th:errors="*{driverFirstName}"></div></div><div class="col-md-6"><label class="form-label" for="driverLastName">Last name</label><input class="form-control" id="driverLastName" required th:field="*{driverLastName}" type="text"><div class="invalid-feedback d-block" th:errors="*{driverLastName}"></div></div></div>
        <h2 class="h5 mt-4">Navigator</h2>
        <div class="row g-3"><div class="col-md-6"><label class="form-label" for="navigatorFirstName">First name</label><input class="form-control" id="navigatorFirstName" required th:field="*{navigatorFirstName}" type="text"><div class="invalid-feedback d-block" th:errors="*{navigatorFirstName}"></div></div><div class="col-md-6"><label class="form-label" for="navigatorLastName">Last name</label><input class="form-control" id="navigatorLastName" required th:field="*{navigatorLastName}" type="text"><div class="invalid-feedback d-block" th:errors="*{navigatorLastName}"></div></div></div>
      </div>
      <div class="card-footer bg-transparent d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" th:href="@{/rally/{rallyId}/routes/{routeId}/competitors(rallyId=${rally.id},routeId=${route.id})}">Cancel</a><button class="btn btn-primary" type="submit">Save changes</button></div>
    </form>
  </div></div></main>
</body>
</html>
