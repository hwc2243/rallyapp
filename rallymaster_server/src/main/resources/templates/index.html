<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #071523; color: #fff; font-family: system-ui, sans-serif; }
    main { text-align: center; }
    .home-main { flex: 1; display: grid; place-items: center; padding: 2rem; }
    h1 { margin: 0; color: #ff6b1a; font-size: clamp(2.5rem, 8vw, 5rem); }
    p { color: #b7c5d3; font-size: 1.2rem; }
    .signin-link { color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <div th:if="${currentUser != null}" th:replace="~{fragments/layout :: navbar}"></div>

  <main class="home-main">
    <h1>RallyMaster</h1>
    <p>Rally design services are ready to make rally planning, management, and running easy.</p>
    <p th:if="${currentUser == null}">
      <a class="signin-link" th:href="@{/oauth2/authorization/keycloak}">Create an account or sign in</a>
    </p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
