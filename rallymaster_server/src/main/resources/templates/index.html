<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/rallymaster-theme.css}" rel="stylesheet">
</head>
<body class="rm-home d-flex flex-column">
  <div th:if="${currentUser != null}" th:replace="~{fragments/layout :: navbar}"></div>

  <main class="home-main flex-grow-1 d-grid align-content-center text-center px-4">
    <h1>RallyMaster</h1>
    <p>Rally design services are ready to make rally planning, management, and running easy.</p>
    <p th:if="${currentUser == null}">
      <a class="signin-link" th:href="@{/oauth2/authorization/keycloak}">Create an account or sign in</a>
    </p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
