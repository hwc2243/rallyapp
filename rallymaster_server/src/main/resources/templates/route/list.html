<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Routes · RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/rallymaster-theme.css}" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <div th:replace="~{fragments/layout :: navbar}"></div>
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <a class="small text-decoration-none" th:href="@{/rally/list}"><i class="bi bi-arrow-left"></i> Rallies</a>
        <h1 class="h2 mb-1 mt-2" th:text="${rally.name}">Rally</h1>
        <p class="text-body-secondary mb-0">Choose a route to plan, or add a new route.</p>
      </div>
      <a class="btn btn-primary" th:href="@{/rally/{rallyId}/routes/new(rallyId=${rally.id})}">
        <i class="bi bi-plus-lg me-1"></i>Add route
      </a>
    </div>
    <section class="card border-0 shadow-sm">
      <div class="list-group list-group-flush" th:if="${!routes.isEmpty()}">
        <div class="list-group-item d-flex justify-content-between align-items-center py-3"
           th:each="route : ${routes}">
          <a class="text-decoration-none text-reset flex-grow-1"
             th:href="@{/rally/{rallyId}/routes/{routeId}(rallyId=${rally.id},routeId=${route.id})}">
          <span>
            <span class="d-block fw-semibold" th:text="${route.name}">Route name</span>
            <small class="text-body-secondary" th:text="${route.description}">Description</small>
          </span>
          </a>
          <span class="d-flex align-items-center gap-3 ms-3">
            <span class="badge text-bg-secondary" th:text="${route.status}">PLAN</span>
            <a class="btn btn-sm btn-outline-secondary" th:if="${route.status.name() == 'PLAN'}"
               th:href="@{/rally/{rallyId}/routes/{routeId}/edit(rallyId=${rally.id},routeId=${route.id})}"
               aria-label="Edit route" title="Edit route"><i class="bi bi-pencil"></i></a>
            <form th:if="${route.status.name() == 'PLAN'}" class="d-inline"
                  th:action="@{/rally/{rallyId}/routes/{routeId}/delete(rallyId=${rally.id},routeId=${route.id})}"
                  method="post" th:attr="onsubmit=|return confirm('Delete route &quot;${route.name}&quot; and all of its instructions and checkpoints? This cannot be undone.');|">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn btn-sm btn-outline-danger" type="submit" aria-label="Delete route" title="Delete route"><i class="bi bi-trash"></i></button>
            </form>
            <i class="bi bi-chevron-right"></i>
          </span>
        </div>
      </div>
      <div class="card-body text-center text-body-secondary py-5" th:if="${routes.isEmpty()}">
        No routes have been created for this rally.
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
