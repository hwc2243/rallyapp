<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Route · RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <div th:replace="~{fragments/layout :: navbar}"></div>
  <main class="container py-4"><div class="row justify-content-center"><div class="col-lg-8 col-xl-7">
    <a class="small text-decoration-none" th:href="@{/rally/{rallyId}/routes(rallyId=${rally.id})}"><i class="bi bi-arrow-left"></i> Routes</a>
    <h1 class="h2 mt-2 mb-1">Create route</h1>
    <p class="text-body-secondary mb-4" th:text="${rally.name}">Rally</p>
    <section class="card border-0 shadow-sm"><div class="card-body p-4">
      <form th:action="@{/rally/{rallyId}/routes(rallyId=${rally.id})}" th:object="${route}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3"><label class="form-label" for="name">Name</label>
          <input id="name" class="form-control" th:field="*{name}" required autofocus th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
          <div class="invalid-feedback" th:errors="*{name}">Name error</div></div>
        <div class="mb-4"><label class="form-label" for="description">Description</label>
          <textarea id="description" class="form-control" th:field="*{description}" rows="4" placeholder="Optional route details"></textarea></div>
        <div class="d-flex gap-2 justify-content-end"><a class="btn btn-outline-secondary" th:href="@{/rally/{rallyId}/routes(rallyId=${rally.id})}">Cancel</a><button class="btn btn-primary" type="submit">Create route</button></div>
      </form>
    </div></section>
  </div></div></main>
</body>
</html>
