<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timing Plan · RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/rallymaster-theme.css}" rel="stylesheet">
</head>
<body class="bg-body-tertiary"><div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4">
  <a class="small text-decoration-none" th:href="@{/rally/{rallyId}/routes/{routeId}(rallyId=${rally.id},routeId=${route.id})}">← Route actions</a>
  <h1 class="h2 mt-2 mb-1">Timing plan</h1><p class="text-body-secondary" th:text="${route.name}">Route</p>
  <section class="card border-0 shadow-sm" th:if="${timingPoints != null}"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
    <thead><tr><th>Item</th><th>Distance</th><th>Arrival (car 0)</th><th>Speed</th><th>Pause</th></tr></thead>
    <tbody><tr th:each="entry : ${timingPoints}">
      <td th:text="${entry.item}">NRI 1</td>
      <td th:text="${entry.distance}">0.000</td>
      <td th:text="${entry.arrival}">2026-01-01 09:00:00.000</td>
      <td th:text="${entry.speed == null ? '—' : entry.speed}">40.0</td>
      <td th:text="${entry.pause}">—</td>
    </tr></tbody>
  </table></div></section>
  <div class="alert alert-info" th:unless="${timingPoints != null}">No timing plan is available. Calculate the timing plan before viewing it.</div>
</main></body></html>
