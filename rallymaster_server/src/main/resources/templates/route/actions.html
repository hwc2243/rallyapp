<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Route Actions · RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/rallymaster-theme.css}" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <div th:replace="~{fragments/layout :: navbar}"></div>
  <main class="container py-4"><div class="row justify-content-center"><div class="col-lg-8 col-xl-7">
    <a class="small text-decoration-none" th:href="@{/rally/{rallyId}/routes(rallyId=${rally.id})}"><i class="bi bi-arrow-left"></i> Routes</a>
    <h1 class="h2 mb-1 mt-2" th:text="${route.name}">Route</h1>
    <p class="text-body-secondary mb-4"><span th:text="${rally.name}">Rally</span><span class="mx-2">·</span><span th:text="${route.status}">PLAN</span></p>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <section class="card border-0 shadow-sm"><div class="list-group list-group-flush">
      <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3"
         th:href="@{/rally/{rallyId}/routes/{routeId}/items(rallyId=${rally.id},routeId=${route.id})}">
        <span><i class="bi bi-list-check me-3 text-primary"></i><strong>Edit</strong><small class="d-block ms-4 text-body-secondary">Edit route instructions and checkpoints</small></span><i class="bi bi-chevron-right"></i>
      </a>
      <form class="list-group-item d-flex justify-content-between align-items-center py-3" method="post"
            th:if="${route.status.name() == 'PLAN'}" th:action="@{/rally/{rallyId}/routes/{routeId}/timing-plan(rallyId=${rally.id},routeId=${route.id})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <span><i class="bi bi-calculator me-3 text-primary"></i><strong>Calculate timing plan</strong><small class="d-block ms-4 text-body-secondary">Calculate car-zero arrival times</small></span>
        <button class="btn btn-outline-primary" type="submit">Calculate</button>
      </form>
      <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3"
         th:href="@{/rally/{rallyId}/routes/{routeId}/timing-plan(rallyId=${rally.id},routeId=${route.id})}">
        <span><i class="bi bi-table me-3 text-primary"></i><strong>View timing plan</strong><small class="d-block ms-4 text-body-secondary" th:text="${hasTimingPlan} ? 'Review calculated car-zero arrival times' : 'No timing plan has been calculated yet'">Review timing plan</small></span><i class="bi bi-chevron-right"></i>
      </a>
      <form class="list-group-item py-3" method="post" th:if="${route.status.name() == 'PLAN'}"
            th:action="@{/rally/{rallyId}/routes/{routeId}/publish(rallyId=${rally.id},routeId=${route.id})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="d-flex justify-content-between align-items-center gap-3">
          <span><i class="bi bi-send me-3 text-primary"></i><strong>Publish</strong><small class="d-block ms-4 text-body-secondary">Make this route available to competitors</small></span>
          <button class="btn btn-primary" type="submit">Publish</button>
        </div>
        <div class="mt-3" th:unless="${eventPasswordConfigured}">
          <label class="form-label" for="eventPassword">Event password</label>
          <input id="eventPassword" class="form-control" type="password" name="eventPassword" autocomplete="new-password" required>
          <div class="form-text">This password is shared by all routes in this rally.</div>
        </div>
      </form>
    </div></section>
  </div></div></main>
</body></html>
