<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add Route Item · RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head><body class="bg-body-tertiary"><div th:replace="~{fragments/layout :: navbar}"></div>
  <main class="container py-4"><div class="row justify-content-center"><div class="col-lg-8">
    <a class="small text-decoration-none" th:href="@{/rally/{rallyId}/routes/{routeId}(rallyId=${rally.id},routeId=${route.id})}"><i class="bi bi-arrow-left"></i> Route items</a>
    <h1 class="h2 mt-2">Add route item</h1><p class="text-body-secondary" th:text="${route.name}">Route</p>
    <div class="row g-3"><div class="col-md-6"><a class="card card-body h-100 text-decoration-none border-0 shadow-sm" th:href="@{/rally/{rallyId}/routes/{routeId}/items/nri/new(rallyId=${rally.id},routeId=${route.id})}"><i class="bi bi-journal-text fs-2 text-primary mb-2"></i><h2 class="h4">NRI</h2><p class="text-body-secondary mb-0">Add a numbered route instruction. Mileage is required; coordinates are optional.</p></a></div>
      <div class="col-md-6"><a class="card card-body h-100 text-decoration-none border-0 shadow-sm" th:href="@{/rally/{rallyId}/routes/{routeId}/items/checkpoint/new(rallyId=${rally.id},routeId=${route.id})}"><i class="bi bi-geo-alt fs-2 text-primary mb-2"></i><h2 class="h4">Checkpoint</h2><p class="text-body-secondary mb-0">Add a checkpoint. Mileage and GPS coordinates are required.</p></a></div></div>
  </div></div></main>
</body></html>
