<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NRI · RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/rallymaster-theme.css}" rel="stylesheet">
</head><body class="bg-body-tertiary"><div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4"><div class="row justify-content-center"><div class="col-lg-8">
  <a class="small text-decoration-none" th:href="@{/rally/{rallyId}/routes/{routeId}(rallyId=${rally.id},routeId=${route.id})}">← Route items</a>
  <h1 class="h2 mt-2" th:text="${routeInstruction.id == null ? 'Add NRI' : 'Edit NRI'}">NRI</h1>
  <p class="text-body-secondary" th:text="${route.name}">Route</p>
  <section class="card border-0 shadow-sm"><div class="card-body p-4">
    <form th:action="@{/rally/{rallyId}/routes/{routeId}/items/nri(rallyId=${rally.id},routeId=${route.id})}" th:object="${routeInstruction}" method="post" novalidate>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" th:field="*{id}">
      <div class="mb-3"><label class="form-label" for="instructionType">NRI type</label><select id="instructionType" class="form-select" th:field="*{instructionType}"><option th:each="type : ${instructionTypes}" th:value="${type}" th:text="${#strings.replace(type.name(), '_', ' ')}">STANDARD</option></select></div>
      <div class="mb-3"><label class="form-label" for="instructionText">Instructions</label><textarea id="instructionText" class="form-control" rows="3" th:field="*{instructionText}" placeholder="Optional route instruction text"></textarea></div>
      <div class="mb-3"><label class="form-label" for="notes">Notes</label><textarea id="notes" class="form-control" rows="3" th:field="*{notes}" placeholder="Optional planner notes"></textarea></div>
      <div class="row g-3 mb-3"><div class="col-md-4"><label class="form-label" for="speed">Speed for next leg</label><input id="speed" type="number" min="0" step="0.1" class="form-control" th:field="*{speed}"></div><div class="col-md-4"><label class="form-label" for="pauseDurationMillis">Pause (milliseconds)</label><input id="pauseDurationMillis" type="number" min="0" class="form-control" th:field="*{pauseDurationMillis}"></div><div class="col-md-4"><label class="form-label" for="transitDurationMillis">Transit duration (milliseconds)</label><input id="transitDurationMillis" type="number" min="0" class="form-control" th:field="*{transitDurationMillis}"><div class="form-text">Required for End Transit.</div></div></div>
      <div class="mb-4"><label class="form-label" for="distance">Mileage</label><input id="distance" type="number" step="0.001" min="0" class="form-control" th:field="*{distance}" required th:classappend="${#fields.hasErrors('distance')} ? ' is-invalid'"><div class="form-text">Required. GPS coordinates are optional for an NRI.</div><div class="invalid-feedback" th:errors="*{distance}">Mileage error</div></div>
      <details class="mb-4"><summary class="text-body-secondary">Optional GPS details</summary><div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label" for="latitude">Latitude</label><input id="latitude" type="number" step="any" class="form-control" th:field="*{latitude}" th:classappend="${#fields.hasErrors('latitude')} ? ' is-invalid'"><div class="invalid-feedback" th:errors="*{latitude}">Latitude error</div></div><div class="col-md-6"><label class="form-label" for="longitude">Longitude</label><input id="longitude" type="number" step="any" class="form-control" th:field="*{longitude}" th:classappend="${#fields.hasErrors('longitude')} ? ' is-invalid'"><div class="invalid-feedback" th:errors="*{longitude}">Longitude error</div></div><div class="col-md-6"><label class="form-label" for="heading">Heading</label><input id="heading" type="number" min="0" max="360" class="form-control" th:field="*{heading}"></div></div></details>
      <div class="d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" th:href="@{/rally/{rallyId}/routes/{routeId}(rallyId=${rally.id},routeId=${route.id})}">Cancel</a><button class="btn btn-primary" type="submit" th:text="${routeInstruction.id == null ? 'Add NRI' : 'Save changes'}">Save</button></div>
    </form>
  </div></section>
</div></div></main></body></html>
