<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select organization · RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/rallymaster-theme.css}" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <div th:replace="~{fragments/layout :: navbar}"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7">
        <section class="card border-0 shadow-sm">
          <div class="card-body p-4 p-md-5">
            <h1 class="h2 mb-2">Select an organization</h1>
            <p class="text-body-secondary mb-4">
              Choose the organization whose rallies you want to work with.
            </p>

            <div class="list-group mb-4" th:if="${!organizations.isEmpty()}">
              <form th:each="organization : ${organizations}"
                    th:action="@{/signin/organization}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="organizationId" th:value="${organization.id}">
                <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3"
                        type="submit">
                  <span th:text="${organization.name}">Organization</span>
                  <i class="bi bi-chevron-right" aria-hidden="true"></i>
                </button>
              </form>
            </div>

            <p class="text-body-secondary" th:if="${organizations.isEmpty()}">
              You are not yet a member of an organization.
            </p>

            <a class="btn btn-primary" th:href="@{/signin/onboard}">
              <i class="bi bi-plus-lg me-2" aria-hidden="true"></i>Create a new organization
            </a>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
