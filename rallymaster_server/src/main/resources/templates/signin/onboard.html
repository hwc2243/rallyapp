<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up your organization · RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <section class="card border-0 shadow-sm">
          <div class="card-body p-4 p-md-5">
            <h1 class="h2 mb-3">Create your organization</h1>
            <p class="text-body-secondary mb-4">
              Organizations keep your rally designs and team members together.
            </p>

            <form th:action="@{/signin/onboard}" th:object="${organization}" method="post">
              <div class="mb-4">
                <label class="form-label" for="name">Organization name</label>
                <input id="name" name="name" class="form-control"
                       th:field="*{name}" th:classappend="${organizationNameError} ? ' is-invalid'"
                       autocomplete="organization" required autofocus>
                <div class="invalid-feedback" th:if="${organizationNameError}"
                     th:text="${organizationNameError}">Organization name is required.</div>
              </div>

              <div class="d-flex gap-2 align-items-center">
                <button class="btn btn-primary" type="submit">Create organization</button>
                <a class="btn btn-outline-secondary" th:href="@{/home}">Cancel</a>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
