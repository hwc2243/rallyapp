<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rallies · RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/2.3.4/css/dataTables.bootstrap5.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <div th:replace="~{fragments/layout :: navbar}"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h2 mb-1">Rallies</h1>
        <p class="text-body-secondary mb-0" th:if="${currentOrganization != null}"
           th:text="${currentOrganization.name}">Current organization</p>
      </div>
      <a class="btn btn-primary" th:href="@{/rally/new}">
        <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Add rally
      </a>
    </div>

    <section class="card border-0 shadow-sm">
      <div class="card-body">
        <table id="rallyTable" class="table table-hover align-middle mb-0">
          <thead>
            <tr><th>Name</th><th>Description</th><th>Date</th><th class="text-end">Actions</th></tr>
          </thead>
          <tbody>
            <tr th:each="rally : ${rallys}">
              <td th:text="${rally.name}">Rally name</td>
              <td th:text="${rally.description}">Rally description</td>
              <td th:text="${rally.date}">Rally date</td>
              <td class="text-end"><a class="btn btn-sm btn-outline-primary" href="#">Open</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/2.3.4/js/dataTables.js"></script>
  <script src="https://cdn.datatables.net/2.3.4/js/dataTables.bootstrap5.js"></script>
  <script>new DataTable('#rallyTable');</script>
</body>
</html>
