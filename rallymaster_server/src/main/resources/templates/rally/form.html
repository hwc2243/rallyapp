<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Rally · RallyMaster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <div th:replace="~{fragments/layout :: navbar}"></div>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="h2 mb-1">Create rally</h1>
            <p class="text-body-secondary mb-0" th:if="${currentOrganization != null}"
               th:text="${currentOrganization.name}">Current organization</p>
          </div>
        </div>

        <section class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <form th:action="@{/rally}" th:object="${rally}" method="post" novalidate>
              <div class="mb-3">
                <label class="form-label" for="name">Name</label>
                <input id="name" class="form-control" th:field="*{name}" required autofocus
                       th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
                <div class="invalid-feedback" th:errors="*{name}">Name error</div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" class="form-control" th:field="*{description}" rows="4"
                          placeholder="Optional details for this rally"></textarea>
              </div>

              <div class="mb-4">
                <label class="form-label" for="date">Date</label>
                <input id="date" class="form-control" th:field="*{date}" type="text" autocomplete="off"
                       placeholder="YYYY-MM-DD" required th:classappend="${#fields.hasErrors('date')} ? ' is-invalid'">
                <div class="form-text">Choose the rally date.</div>
                <div class="invalid-feedback" th:errors="*{date}">Date error</div>
              </div>

              <div class="d-flex gap-2 justify-content-end">
                <a class="btn btn-outline-secondary" th:href="@{/rally/list}">Cancel</a>
                <button class="btn btn-primary" type="submit">Create rally</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $('#date').datepicker({ dateFormat: 'yy-mm-dd', changeMonth: true, changeYear: true });
  </script>
</body>
</html>
